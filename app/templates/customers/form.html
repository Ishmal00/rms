{% extends "base.html" %}

{% block title %}{{ 'Edit' if customer else 'Add' }} Customer - GourmetOS{% endblock %}
{% block page_title %}{{ 'Edit' if customer else 'Add' }} Customer{% endblock %}

{% block content %}
<div class="card border-0 shadow-sm" style="max-width: 760px;">
  <div class="card-body p-4">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="name">Name</label>
          <input class="form-control" id="name" name="name" maxlength="100" required value="{{ request.form.get('name', customer.name if customer else '') }}">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="phone">Phone</label>
          <input class="form-control" id="phone" name="phone" maxlength="30" required value="{{ request.form.get('phone', customer.phone if customer else '') }}">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" id="email" name="email" type="email" maxlength="120" value="{{ request.form.get('email', customer.email if customer else '') }}">
        </div>
        <div class="col-12">
          <label class="form-label" for="notes">Notes</label>
          <textarea class="form-control" id="notes" name="notes" rows="3">{{ request.form.get('notes', customer.notes if customer else '') }}</textarea>
        </div>
      </div>
      <div class="d-flex gap-2 mt-4">
        <button class="btn btn-primary" type="submit">Save Customer</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('customers.index') }}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
