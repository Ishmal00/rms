{% extends "base.html" %}

{% block title %}{{ 'Edit' if employee else 'Add' }} Employee - GourmetOS{% endblock %}
{% block page_title %}{{ 'Edit' if employee else 'Add' }} Employee{% endblock %}

{% block content %}
<div class="card border-0 shadow-sm" style="max-width: 900px;">
  <div class="card-body p-4">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="employee_code">Employee Code</label>
          <input class="form-control" id="employee_code" name="employee_code" maxlength="50" required value="{{ request.form.get('employee_code', employee.employee_code if employee else '') }}">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="designation">Designation</label>
          <input class="form-control" id="designation" name="designation" maxlength="100" required value="{{ request.form.get('designation', employee.designation if employee else '') }}">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="first_name">First Name</label>
          <input class="form-control" id="first_name" name="first_name" maxlength="50" required value="{{ request.form.get('first_name', employee.first_name if employee else '') }}">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="last_name">Last Name</label>
          <input class="form-control" id="last_name" name="last_name" maxlength="50" required value="{{ request.form.get('last_name', employee.last_name if employee else '') }}">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="department_id">Department</label>
          <select class="form-select" id="department_id" name="department_id" required>
            <option value="">Select department</option>
            {% for department in departments %}
            <option value="{{ department.id }}" {{ 'selected' if request.form.get('department_id', employee.department_id|string if employee else '')|string == department.id|string else '' }}>{{ department.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="shift_id">Shift</label>
          <select class="form-select" id="shift_id" name="shift_id" required>
            <option value="">Select shift</option>
            {% for shift in shifts %}
            <option value="{{ shift.id }}" {{ 'selected' if request.form.get('shift_id', employee.shift_id|string if employee and employee.shift_id else '')|string == shift.id|string else '' }}>{{ shift.name }} ({{ shift.start_time.strftime('%H:%M') }} - {{ shift.end_time.strftime('%H:%M') }})</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="hire_date">Hire Date</label>
          <input class="form-control" id="hire_date" name="hire_date" type="date" required value="{{ request.form.get('hire_date', employee.hire_date.isoformat() if employee else '') }}">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="base_salary">Base Salary</label>
          <input class="form-control" id="base_salary" name="base_salary" type="number" min="0" step="0.01" required value="{{ request.form.get('base_salary', employee.base_salary if employee else '0.00') }}">
        </div>
        <div class="col-12">
          <label class="form-label" for="emergency_contact">Emergency Contact</label>
          <input class="form-control" id="emergency_contact" name="emergency_contact" maxlength="100" value="{{ request.form.get('emergency_contact', employee.emergency_contact if employee else '') }}">
        </div>
      </div>
      <div class="d-flex gap-2 mt-4">
        <button class="btn btn-primary" type="submit">Save Employee</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('staff.index') }}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
